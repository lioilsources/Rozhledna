[package]
name = "rz-agent"
description = "Rozhledna agent: sources, capture → encode → QUIC, pairing, tray"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rz-proto.workspace = true
rz-net.workspace = true
rz-capture.workspace = true
rz-codec.workspace = true
rz-input.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true
quinn.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon.workspace = true
tao.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString"] }
objc2-app-kit = { workspace = true, features = ["NSAlert", "NSApplication", "NSRunningApplication", "NSResponder", "NSButton", "NSControl", "NSView", "NSWorkspace"] }

[dev-dependencies]
rz-input.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true

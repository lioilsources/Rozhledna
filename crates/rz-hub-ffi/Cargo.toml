[package]
name = "rz-hub-ffi"
description = "C ABI over rz-hub-core for the Flutter hub (staticlib)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
rz-hub-core = { path = "../rz-hub-core" }
rz-net.workspace = true
rz-proto.workspace = true
rz-capture.workspace = true
rz-input.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-video.workspace = true
objc2-core-foundation.workspace = true

[dev-dependencies]
rz-agent.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true

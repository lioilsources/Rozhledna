[package]
name = "spike-viewer"
description = "Phase 0 spike viewer: QUIC → VideoToolbox decode → CALayer (IOSurface), latency overlay + CSV"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "spike_viewer"
path = "src/lib.rs"

[[bin]]
name = "spike-viewer"
path = "src/main.rs"

[dependencies]
rz-proto.workspace = true
rz-net.workspace = true
rz-capture.workspace = true
rz-codec.workspace = true
rz-latency.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
dispatch2.workspace = true
objc2-foundation.workspace = true
objc2-core-foundation.workspace = true
objc2-core-video.workspace = true
objc2-core-graphics.workspace = true
objc2-app-kit.workspace = true
objc2-quartz-core.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    "crates/rz-proto",
    "crates/rz-net",
    "crates/rz-capture",
    "crates/rz-codec",
    "crates/rz-agent",
    "crates/rz-cli",
    "crates/rz-input",
    "crates/rz-hub-core",
    "crates/rz-hub-ffi",
    "crates/xtask",
    "spikes/spike-agent",
    "spikes/spike-viewer",
    "spikes/rz-spike-ffi",
    "tools/latency",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Versions verified on crates.io 2026-11-22 (see DECISIONS.md).
anyhow = "1.0.104"
thiserror = "2.0.21"
bytes = "1.12.2"
clap = { version = "4.6.9", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
prost = "0.14.6"
quinn = "0.11.12"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = "0.14.10"
libc = "0.2"

objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-video-toolbox = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-graphics = "0.3.2"

sha2 = "0.11.1"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
mdns-sd = "0.22.0"
tray-icon = "0.26.1"
tao = "0.37.3"
rz-proto = { path = "crates/rz-proto" }
rz-net = { path = "crates/rz-net" }
rz-capture = { path = "crates/rz-capture" }
rz-codec = { path = "crates/rz-codec" }
rz-input = { path = "crates/rz-input" }
rz-agent = { path = "crates/rz-agent" }
rz-latency = { path = "tools/latency" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = 1
